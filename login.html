<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — DevZenith 2026</title>
  <meta name="description" content="Log in to access your registrations, passes, and festival planner.">
  <script>(function(){var t=localStorage.getItem('dz-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <nav class="nav" id="main-nav">
    <div class="container nav__container">
      <a href="index.html" class="nav__logo">
        <span class="nav__logo-mark">DZ</span>
        <span class="nav__logo-text">DEVZENITH</span>
      </a>
      <ul class="nav__links" id="nav-links">
        <li><a href="index.html" class="nav__link" data-nav="home">Home</a></li>
        <li><a href="events.html" class="nav__link" data-nav="events">Events</a></li>
        <li><a href="festival.html" class="nav__link" data-nav="festival">My Festival</a></li>
        <li><a href="dashboard.html" class="nav__link" data-nav="dashboard">Dashboard</a></li>
      </ul>
      <div class="nav__actions">
        <button class="btn btn--icon theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <i data-lucide="sun" class="theme-icon theme-icon--light"></i>
          <i data-lucide="moon" class="theme-icon theme-icon--dark"></i>
        </button>
        <div class="nav__auth" id="nav-auth">
          <a href="login.html" class="btn btn--ghost btn--sm">Log In</a>
          <a href="signup.html" class="btn btn--primary btn--sm">Sign Up</a>
        </div>
        <button class="nav__toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>
  <div class="mobile-nav" id="mobile-nav">
    <ul class="mobile-nav__links">
      <li><a href="index.html" class="mobile-nav__link" data-nav="home">Home</a></li>
      <li><a href="events.html" class="mobile-nav__link" data-nav="events">Events</a></li>
      <li><a href="festival.html" class="mobile-nav__link" data-nav="festival">My Festival</a></li>
      <li><a href="dashboard.html" class="mobile-nav__link" data-nav="dashboard">Dashboard</a></li>
    </ul>
    <div class="mobile-nav__auth" id="mobile-nav-auth">
      <a href="login.html" class="btn btn--ghost">Log In</a>
      <a href="signup.html" class="btn btn--primary">Sign Up</a>
    </div>
  </div>
  
  <main id="main-content">
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-header__logo">
            <span class="nav__logo-mark" style="width:48px;height:48px;font-size:var(--text-lg)">DZ</span>
          </a>
          <h1 class="auth-header__title">Welcome back</h1>
          <p class="auth-header__subtitle">Log in to access your registrations, passes, and festival planner.</p>
        </div>
        
        <form class="auth-form" id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email" class="form-label">Email</label>
            <input type="email" id="login-email" name="email" class="form-input" placeholder="you@university.edu" required autocomplete="email">
            <span class="form-error" id="login-email-error"></span>
          </div>
          
          <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <div style="position:relative">
              <input type="password" id="login-password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" class="btn btn--icon btn--sm password-toggle" id="toggle-password" aria-label="Show password" style="position:absolute;right:var(--space-2);top:50%;transform:translateY(-50%)">
                <i data-lucide="eye" width="16" height="16"></i>
              </button>
            </div>
            <span class="form-error" id="login-password-error"></span>
          </div>
          
          <div id="login-error" class="form-error" style="display:none;text-align:center;margin-bottom:var(--space-4)"></div>
          
          <button type="submit" class="btn btn--primary btn--lg" style="width:100%;margin-top:var(--space-4)" id="login-submit">
            Log In
          </button>
        </form>
        
        <div class="auth-footer">
          <p>Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
      </div>
    </div>
  </main>
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
